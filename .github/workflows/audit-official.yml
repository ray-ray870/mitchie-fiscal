name: 公式データとの照合（確認のみ）

# アプリのデータ（data-*.json）を、総務省の公式Excelと全項目・全年度・全団体で突き合わせる。
#   ・データは一切書き換えない（確認専用）
#   ・結果は実行画面の Summary に表で出る
#   ・確認が必要な点があれば赤い×、問題なしなら緑のチェック
#   ・3月の年次更新の後や、データを直した後に実行する
# 年度が増えたら scripts/audit_official_data.py の *_PAGES に新しい年を追加する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install pandas openpyxl xlrd

      - name: 公式データと照合する
        run: python scripts/audit_official_data.py
