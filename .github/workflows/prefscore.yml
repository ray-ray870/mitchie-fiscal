name: 都道府県スコアの見直し

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview か apply を選ぶ"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - apply

jobs:
  prefscore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/refactor_prefscore.py ${{ inputs.mode }}
      - if: ${{ inputs.mode == 'apply' }}
        run: rm -rf preview
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "都道府県スコアの見直し (${{ inputs.mode }})"
            git push
          fi
