name: 財政調整基金の四捨五入をそろえる（1回だけ）

# 財政調整基金の値の四捨五入（7.85億円 → 7.8 か 7.9 か）が団体・年によってばらばらだったのを、
# 総務省の公式Excelから計算し直して、ふつうの四捨五入（7.9）にそろえる（2026-09-30）。
#   ・書き換えるのは preview/ のデータだけ。丸め方の違い（0.1億円）より大きく違うものがあれば、何も書き換えずに止まる。
#   ・終わったら「年次更新のリハーサル」で確認し、「プレビューのデータを本番に反映」で本番へ。
#   ・使い終わったら、このファイルと scripts/fix_reserve_rounding.py は削除してよい。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      MITCHIE_DATA_DIR: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas openpyxl xlrd

      - name: 公式Excelから計算し直す
        run: python scripts/fix_reserve_rounding.py

      - name: 整合性チェック
        run: |
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from update_fiscal_data import validate
          sys.exit(0 if validate() else 1)
          "

      - name: preview/ に保存
        id: commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/data-*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "財政調整基金の四捨五入をそろえる（preview）"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: プレビューを公開
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-with-check.yml/dispatches" \
            -d '{"ref":"main"}'
