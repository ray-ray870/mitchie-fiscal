name: プレビューを本番に反映

# 「Actions」タブから手動で実行するワークフロー。
# preview/ フォルダで動作確認済みの index.html・JS・CSSファイルを本番(ルート)にコピーし、
# index.html内のキャッシュ用バージョン番号(?v=...)を自動で新しくして、
# 最後に deploy-with-check.yml を呼び出してサイトに公開する。
#
# ⚠️ 対象は index.html・js/*.js・images.js・style.css のみ。
#    data-*.json や kokaikei.json などのデータファイルはこのワークフローでは
#    一切触らない(データの本番反映は「プレビューのデータを本番に反映」の役目のため)。
#
# ⚠️ index.html も preview/ の内容で上書きする（2026-09-28〜）。
#    本番の index.html を直接直したとき（例：3月の年次更新でOGPの自治体数を書き換えたとき）は、
#    preview/index.html も必ず同じように直しておくこと。
#    直し忘れると、次にこのワークフローを実行したとき本番が古い内容に戻ってしまう。
#    念のため、実行ログに「本番からどう変わるか（?v=の番号は除く）」を表示している。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: プレビューのindex.html・JS・CSSを本番にコピー
        run: |
          set -e
          if [ -f preview/index.html ]; then
            echo "=== index.html：本番からの変更点（?v=の番号は除く。何も出なければ変更なし） ==="
            diff <(sed -E 's/\?v=[0-9]+//g' index.html) <(sed -E 's/\?v=[0-9]+//g' preview/index.html) || true
            echo "=== ここまで ==="
            cp -f preview/index.html index.html
          fi
          cp -f preview/js/*.js js/
          if [ -f preview/images.js ]; then cp -f preview/images.js images.js; fi
          if [ -f preview/style.css ]; then cp -f preview/style.css style.css; fi

      - name: キャッシュ用バージョン番号を新しくする
        run: |
          set -e
          NEWVER=$(date -u +%Y%m%d%H%M)
          sed -i -E "s/(js\/[a-zA-Z0-9_-]+\.js\?v=)[0-9]+/\1${NEWVER}/g" index.html
          sed -i -E "s/(images\.js\?v=)[0-9]+/\1${NEWVER}/g" index.html
          sed -i -E "s/(style\.css\?v=)[0-9]+/\1${NEWVER}/g" index.html
          echo "新バージョン番号: ${NEWVER}"

      - name: 差分がある場合のみコミット
        id: commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/*.js images.js style.css index.html
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "プレビューの内容を本番に反映"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 公開処理(deploy-with-check)を自動実行
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-with-check.yml/dispatches" \
            -d '{"ref":"main"}'
