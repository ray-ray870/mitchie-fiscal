name: トップ画像差し替え

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（まずpreviewで確認してからapply）'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - apply

jobs:
  refactor-top-image:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: images.js を検証・差し替え
        run: python scripts/refactor_topimage.py ${{ github.event.inputs.mode }}

      - name: apply時はpreviewフォルダを削除
        if: github.event.inputs.mode == 'apply'
        run: git rm -r --ignore-unmatch preview

      - name: 変更内容を確認
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: previewモード時、本番のimages.jsが変更されていないことを確認
        if: github.event.inputs.mode == 'preview'
        run: |
          if ! git diff --cached --quiet -- images.js; then
            echo "::error::previewモードなのに本番のimages.jsが変更されています。中止します。"
            exit 1
          fi

      - name: 変更をコミット・プッシュ
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "トップ画像差し替え (${{ github.event.inputs.mode }})"
          git push

      - name: 変更なしの場合の通知
        if: steps.diff.outputs.changed == 'false'
        run: echo "変更はありませんでした。"
